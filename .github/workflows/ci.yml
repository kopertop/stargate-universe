name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-game:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check game modules
        run: 'for f in src/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "syntax error: $f"; exit 1; }; done'
      - name: Validate data JSON
        run: for f in data/*.json .claude/launch.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Install deps for typecheck
        run: npm install
      - name: Run unit tests
        run: node --test tests/*.test.js
        timeout-minutes: 2
      - name: Type check (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build itch.io zip
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sgu-destiny-html5
          path: dist/sgu-destiny-html5.zip
