<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portal shader preview — stargate_portal.gdshader</title>
<style>
  html,body{height:100%;margin:0;background:#0a0704;color:#f2e0c5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box}
  canvas{width:min(92vw, 720px);height:min(56vw, 420px);border:1px solid #3b2a10;border-radius:12px;background:#000;image-rendering:pixelated}
  .row{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;max-width:860px}
  label{display:inline-flex;align-items:center;gap:8px;font-size:14px}
  input[type="range"]{width:140px}
  .muted{opacity:.85;max-width:860px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="row" id="controls"></div>
  <div class="muted">Simplified CPU preview of the <code>stargate_portal.gdshader</code> logic — not a full shader build.</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const params = {
  oval_ratio: 0.55,
  body_edge_inner: 0.88,
  body_edge_outer: 1.0,
  ring_inner_start: 0.82,
  ring_inner_end: 0.93,
  ring_outer_start: 0.96,
  ring_outer_end: 1.04,
  brightness: 3.0,
  ring_brightness: 3.0,
  halo_brightness: 0.8,
  halo_outer: 1.18,
  halo_inner: 0.94,
  halo_alpha_mult: 0.75,
  speed: 1.0,
  turbulence: 1.5,
  noise1_scale: 5.0,
  noise1_speed_x: 0.05,
  noise1_speed_y: 0.10,
  noise1_weight: 0.55,
  noise2_scale: 11.0,
  noise2_speed_x: -0.09,
  noise2_speed_y: 0.07,
  noise2_weight: 0.45,
  swirl_strength: 0.6,
  cloud_threshold_low: 0.12,
  cloud_threshold_high: 0.88,
  fbm_octaves: 5,
};

function hash(p){
  const q = p[0]*127.1 + p[1]*311.7;
  return ((Math.sin(q)*43758.5453) % 1 + 1) % 1;
}
function vnoise(p){
  const i=[Math.floor(p[0]),Math.floor(p[1])];
  const f=[p[0]-i[0],p[1]-i[1]];
  const u=[f[0]*f[0]*(3-2*f[0]), f[1]*f[1]*(3-2*f[1])];
  const a=hash(i);
  const b=hash([i[0]+1,i[1]]);
  const c=hash([i[0],i[1]+1]);
  const d=hash([i[0]+1,i[1]+1]);
  return a+(b-a)*u[0]+(c-a)*u[1]+(a-b-c+d)*u[0]*u[1];
}
function fbm(p,oct){
  let v=0,a=0.5;
  for(let i=0;i<8;i++){
    if(i>=oct) break;
    v+=a*vnoise(p);
    p=[p[0]*2,p[1]*2];
    a*=0.5;
  }
  return v;
}

const palette = {
  core: [1.0, 0.85, 0.55],
  mid:  [0.95, 0.45, 0.10],
  edge: [0.35, 0.08, 0.01],
};

function draw(t){
  const img = ctx.createImageData(W, H);
  const out = img.data;
  const cx = W/2, cy = H/2;
  const scale = Math.min(W,H);
  const t1 = [t*params.noise1_speed_x*params.speed, t*params.noise1_speed_y*params.speed];
  const t2 = [t*params.noise2_speed_x*params.speed, t*params.noise2_speed_y*params.speed];

  for(let y=0; y<H; y++){
    for(let x=0; x<W; x++){
      const ux = (x-cx)/scale, uy = (y-cy)/scale;
      const safeOval = Math.max(params.oval_ratio, 0.001);
      const e = [ux/safeOval, uy];
      const r = Math.hypot(e[0], e[1])*2;

      const ang = Math.atan2(e[1], e[0]);
      const rad = Math.hypot(e[0], e[1])*2;

      const n1 = fbm([ux*params.noise1_scale*params.turbulence+t1[0], uy*params.noise1_scale*params.turbulence+t1[1]], params.fbm_octaves);
      const n2 = fbm([ux*params.noise2_scale*params.turbulence+t2[0], uy*params.noise2_scale*params.turbulence+t2[1]], params.fbm_octaves);
      const n = n1*params.noise1_weight + n2*params.noise2_weight;

      const swirl = params.swirl_strength*(1 - Math.min(1, rad/1))*(n - 0.5);
      const wa = ang + swirl;
      const wr = rad*0.5;
      const warped=[Math.cos(wa)*wr, Math.sin(wa)*wr];

      const n1b = fbm([warped[0]*params.noise1_scale*params.turbulence+t1[0], warped[1]*params.noise1_scale*params.turbulence+t1[1]], params.fbm_octaves);
      const n2b = fbm([warped[0]*params.noise2_scale*params.turbulence+t2[0], warped[1]*params.noise2_scale*params.turbulence+t2[1]], params.fbm_octaves);
      const nb = n1b*params.noise1_weight + n2b*params.noise2_weight;

      const dr = r + (n-0.5)*0.12;
      const body = 1 - smoothstep(params.body_edge_inner, params.body_edge_outer, dr);
      const ring = smoothstep(params.ring_inner_start, params.ring_inner_end, dr) - smoothstep(params.ring_outer_start, params.ring_outer_end, dr);
      const clouds = smoothstep(params.cloud_threshold_low, params.cloud_threshold_high, nb);

      const bm = 1 - smoothstep(-0.15, 0.15, uy);
      const rb = [palette.edge[0]*params.brightness*params.ring_brightness, palette.edge[1]*params.brightness*params.ring_brightness, palette.edge[2]*params.brightness*params.ring_brightness];
      const rt = [palette.mid[0]*params.brightness*1.4, palette.mid[1]*params.brightness*1.4, palette.mid[2]*params.brightness*1.4];
      const ring_col = [rt[0]+(rb[0]-rt[0])*bm, rt[1]+(rb[1]-rt[1])*bm, rt[2]+(rb[2]-rt[2])*bm];

      const energy = (1 - Math.min(1, rad))*0.6 + clouds*0.4;
      const dark = [palette.edge[0]*params.brightness, palette.edge[1]*params.brightness, palette.edge[2]*params.brightness];
      const light = [palette.core[0]*params.brightness, palette.core[1]*params.brightness, palette.core[2]*params.brightness];
      const mid = [palette.mid[0]*params.brightness, palette.mid[1]*params.brightness, palette.mid[2]*params.brightness];
      const inner = mix3(dark, mix3(mid, light, energy), clouds);
      const col = [inner[0]*body + ring_col[0]*ring, inner[1]*body + ring_col[1]*ring, inner[2]*body + ring_col[2]*ring];

      const halo = smoothstep(params.halo_outer, params.halo_inner, r)*(1-body)*clouds;
      const hc = [palette.mid[0]*params.brightness*params.halo_brightness, palette.mid[1]*params.brightness*params.halo_brightness, palette.mid[2]*params.brightness*params.halo_brightness];
      col[0] += hc[0]*halo;
      col[1] += hc[1]*halo;
      col[2] += hc[2]*halo;

      const a = Math.min(1, body + ring + halo*params.halo_alpha_mult);
      const idx = (y*W + x)*4;
      out[idx]   = Math.min(255, col[0]*255);
      out[idx+1] = Math.min(255, col[1]*255);
      out[idx+2] = Math.min(255, col[2]*255);
      out[idx+3] = a*255;
    }
  }
  ctx.putImageData(img, 0, 0);
}
function smoothstep(e0,e1,x){
  const t = Math.max(0, Math.min(1, (x-e0)/(e1-e0)));
  return t*t*t*(t*(t*6-15)+10);
}
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

function loop(ts){
  const t = ts/1000;
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

(function buildControls(){
  const map = {
    'Speed': 'speed',
    'Swirl': 'swirl_strength',
    'Ring': 'ring_brightness',
    'Halo': 'halo_brightness',
    'Oval': 'oval_ratio',
    'Turbulence': 'turbulence',
    'Cloud hi': 'cloud_threshold_high',
    'Cloud lo': 'cloud_threshold_low',
  };
  const wrap = document.getElementById('controls');
  for (const [label, key] of Object.entries(map)){
    const el = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'range';
    input.min = String(params[key] * 0.3);
    input.max = String(params[key] * 3);
    input.step = 'any';
    input.value = String(params[key]);
    input.addEventListener('input', ()=>{
      params[key] = parseFloat(input.value);
    });
    el.textContent = label;
    el.prepend(input);
    wrap.appendChild(el);
  }
})();
</script>
</body>
</html>
