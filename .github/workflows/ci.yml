name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  godot-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.6.2-stable

      - name: Validate project (headless import + editor parse)
        run: godot --headless --editor --quit
        # Exits non-zero on import/scene/script parse errors.
        # No export_presets.cfg yet → no export step.
        # No GUT addon → no unit tests yet.
