name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: TypeScript typecheck
        run: bun run typecheck
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: Run tests
        run: bun run test
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
